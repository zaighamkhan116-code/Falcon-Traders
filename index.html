<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falcon Traders</title><link rel="stylesheet" href="/style.css?v=20260926-3"></head><body class="view-mode">
<div class="hero-zone"><header><div class="brand"><div class="wing" aria-label="Falcon">🦅</div><div><h1>Falcon Traders</h1><p>Coal Supply Management</p></div><button id="modeBtn" class="mode-btn"><span class="mode-label">Mode:</span> View</button></div></header><main>
<section class="summary dashboard-row"><div class="vehicle-summary"><span>Total Vehicles</span><div class="vehicle-setting"><div class="count-box" id="vehicleCount">3</div><button id="editCount" class="edit-count">Edit</button><div id="stepper" class="stepper hidden"><button id="minus" aria-label="Decrease vehicles">−</button><button id="plus" aria-label="Increase vehicles">+</button></div></div></div><div><span>Total Cycles</span><strong id="cycleTotal">0</strong></div><div><span>Pending Payments</span><strong id="pending">0</strong></div><div><span>Total Net Profit</span><strong id="profit">Rs 0</strong></div></section>
</div><section id="cycles"></section><button id="addCycle" class="add-cycle">+ Add First Cycle</button>
</main>
<div id="passwordOverlay" class="password-overlay hidden"><div class="password-card"><h2>Enter Edit Mode</h2><p>Password required to modify records.</p><input id="modePassword" type="password" inputmode="numeric" placeholder="Password"><div id="passwordError" class="password-error"></div><div class="password-actions"><button id="cancelPassword" type="button">Cancel</button><button id="unlockEdit" type="button">Enter Edit Mode</button></div></div></div><div id="overlay" class="overlay hidden"><div class="panel"><div class="panel-head"><div><small id="cycleLabel"></small><h2 id="formTitle">Vehicle Entry</h2></div><button id="close">×</button></div><form id="form">
<label>Date<input name="date" type="date" required></label><label>Company<input name="company" required placeholder="Company name"></label><label>Vehicle No.<input name="vehicle" required placeholder="Vehicle number"></label><label>Received Weight (tons)<input name="received" type="number" step="0.01" min="0"></label><label>Purchase Weight (tons)<input name="purchaseWeight" type="number" step="0.01" min="0"></label><label>Purchase Rate (Rs/ton)<input name="purchaseRate" type="number" step="0.01" min="0"></label><label>Sale Rate (Rs/ton)<input name="saleRate" type="number" step="0.01" min="0"></label><label>Additional Cost (if any)<input name="additionalCost" type="number" step="0.01" min="0" value="0"></label><label>Net Profit (Rs)<input name="netProfit" class="net-profit-auto" type="number" step="0.01" readonly></label><label>Additional Information<textarea name="additionalInformation" rows="3" placeholder=""></textarea></label><label>Status<select name="status"><option>En Route</option><option>Delivered</option></select></label><label>Payment<select name="payment"><option>Pending</option><option>Received</option></select></label><section class="upload-slips"><h3>Upload slips</h3><p>Upload files below</p><label>1: Order slip<input type="file" name="orderSlipFile" accept="image/*"></label><div class="upload-preview" data-preview="orderSlip"></div><label>2: Receiving<input type="file" name="receivingFile" accept="image/*"></label><div class="upload-preview" data-preview="receiving"></div><label>3: Any other Record<input type="file" name="otherRecordFile" accept="image/*"></label><div class="upload-preview" data-preview="otherRecord"></div></section><button id="saveBtn" class="save" type="submit">Save</button></form></div></div><script src="/app.js?v=20260926-10"></script><div id="imageViewer" class="image-viewer hidden"><button id="closeImageViewer" type="button" aria-label="Close image">×</button><img id="fullSlipImage" alt="Uploaded slip"></div></body></html>
