<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falcon Traders</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><div class="wing" aria-label="Falcon">🦅</div><div><h1>Falcon Traders</h1><p>Coal Supply Management</p></div><button id="modeBtn" class="mode-btn">Mode: View</button></div></header><main>
<section class="cycle-control"><div><span>Number of vehicles in a cycle</span></div><div class="vehicle-setting"><div class="count-box" id="vehicleCount">3</div><button id="editCount" class="edit-count">Edit</button><div id="stepper" class="stepper hidden"><button id="minus" aria-label="Decrease vehicles">−</button><button id="plus" aria-label="Increase vehicles">+</button></div></div></section>
<section class="summary"><div><span>Total Cycles</span><strong id="cycleTotal">0</strong></div><div><span>Total Loads</span><strong id="loads">0</strong></div><div><span>Pending Payments</span><strong id="pending">0</strong></div><div><span>Total Net Profit</span><strong id="profit">Rs 0</strong></div></section>
<section id="cycles"></section><button id="addCycle" class="add-cycle">+ Add First Cycle</button>
</main>
<div id="passwordOverlay" class="password-overlay hidden"><div class="password-card"><h2>Enter Edit Mode</h2><p>Password required to modify records.</p><input id="modePassword" type="password" inputmode="numeric" placeholder="Password"><div id="passwordError" class="password-error"></div><div class="password-actions"><button id="cancelPassword" type="button">Cancel</button><button id="unlockEdit" type="button">Enter Edit Mode</button></div></div></div><div id="overlay" class="overlay hidden"><div class="panel"><div class="panel-head"><div><small id="cycleLabel"></small><h2 id="formTitle">Vehicle Entry</h2></div><button id="close">×</button></div><form id="form">
<label>Date<input name="date" type="date" required></label><label>Company<input name="company" required placeholder="Company name"></label><label>Vehicle No.<input name="vehicle" required placeholder="Vehicle number"></label><label>Received Weight (tons)<input name="received" type="number" step="0.01" min="0"></label><label>Purchase Weight (tons)<input name="purchaseWeight" type="number" step="0.01" min="0"></label><label>Purchase Rate (Rs/ton)<input name="purchaseRate" type="number" step="0.01" min="0"></label><label>Sale Rate (Rs/ton)<input name="saleRate" type="number" step="0.01" min="0"></label><label>Net Profit (Rs)<input name="netProfit" type="number" step="0.01"></label><label>Payment Status<select name="payment"><option>Pending</option><option>Received</option></select></label><button id="saveBtn" class="save" type="submit">Save</button></form></div></div><script src="/app.js"></script></body></html>
